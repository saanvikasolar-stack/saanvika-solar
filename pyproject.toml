[project]
name = "saanvika-assistant"
version = "0.1.0"
description = "Personal assistant agent with tools for notes, tasks, and reminders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50.0"]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
